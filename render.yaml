services:
  - type: web
    name: multiplayer-room-test
    runtime: node
    plan: free
    repo: https://github.com/MatthiasCasanova/multiplayer-room-test
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: "https://multiplayer-room-test.onrender.com,https://mathiascasanova.com,https://www.mathiascasanova.com,http://localhost:3000"
